<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1118f2">
<title>Intro Remote</title>
<style>
  :root { color-scheme: dark; --blue:#1118f2; --ink:#f8f8f2; --dim:rgba(248,248,242,.62); }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--blue); color:var(--ink); }
  body {
    min-height:100svh; display:grid; place-items:center;
    padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));
    font-family:ui-monospace,"SFMono-Regular",Menlo,Monaco,Consolas,monospace;
  }
  main { width:min(100%,440px); display:grid; gap:24px; }
  [hidden] { display:none!important; }
  .panel { display:grid; gap:24px; }
  .eyebrow,.status { margin:0; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
  h1 { margin:0; max-width:12ch; font-size:clamp(38px,13vw,72px); line-height:.92; letter-spacing:-.065em; }
  button {
    appearance:none; width:100%; min-height:88px; border:2px solid var(--ink); border-radius:0;
    background:var(--ink); color:var(--blue); cursor:pointer; touch-action:manipulation;
    font:700 clamp(18px,5vw,24px)/1 ui-monospace,"SFMono-Regular",Menlo,Monaco,Consolas,monospace;
    letter-spacing:.08em; text-transform:uppercase;
  }
  button:active { transform:translateY(2px); }
  button:disabled { background:transparent; color:var(--ink); opacity:.72; }
  .name-input {
    width:100%; min-height:66px; padding:12px 0; border:0; border-bottom:2px solid var(--ink);
    border-radius:0; outline:0; background:transparent; color:var(--ink);
    font:500 clamp(24px,8vw,42px)/1 ui-monospace,"SFMono-Regular",Menlo,Monaco,Consolas,monospace;
    letter-spacing:-.035em;
  }
  .name-input::placeholder { color:var(--dim); opacity:1; }
  .channel-grid,.camera-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .channel,.camera,.reset { min-height:64px; padding:10px; background:transparent; color:var(--ink); font-size:14px; line-height:1.15; }
  .channel:last-child { grid-column:1/-1; }
  .channel.is-active,.camera.is-active { background:var(--ink); color:var(--blue); }
  .camera-deck { display:grid; gap:10px; }
  .reset { min-height:48px; font-size:12px; border-width:1px; }
  .status { min-height:1.4em; letter-spacing:.08em; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Tawfeeq Martin · Companion 001</p>
  <form id="launchPanel" class="panel">
    <h1>What should I call you?</h1>
    <input id="visitorName" class="name-input" maxlength="24" autocomplete="given-name"
      enterkeyhint="go" placeholder="First name" aria-label="Your first name">
    <button id="start" type="submit">Enter / run intro</button>
  </form>
  <section id="channelPanel" class="panel" hidden>
    <h1>Pick a channel.</h1>
    <div class="channel-grid" aria-label="Macintosh channels">
      <button class="channel" data-channel="help">01 · Help</button>
      <button class="channel" data-channel="blackbird">02 · Blackbird</button>
      <button class="channel" data-channel="louisvuitton">03 · Louis Vuitton</button>
      <button class="channel" data-channel="handofgod">04 · Hand of God</button>
      <button class="channel" data-channel="filmreel">05 · Film Reel</button>
    </div>
    <div class="camera-deck">
      <p class="eyebrow">Camera deck</p>
      <div class="camera-grid">
        <button class="camera" data-camera="wide">01 · Mouth Master</button>
        <button class="camera" data-camera="hero">02 · Dead-on Hero</button>
        <button class="camera" data-camera="floor">03 · Low Dolly</button>
        <button class="camera" data-camera="left">04 · Left Three-quarter</button>
        <button class="camera" data-camera="right">05 · Right Three-quarter</button>
        <button class="camera" data-camera="crane">06 · Crane Establishing</button>
      </div>
    </div>
    <button id="reset" class="reset">Stop / reset</button>
  </section>
  <p id="status" class="status">Connecting…</p>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const session = String(params.get('session') || '');
  const launchPanel = document.getElementById('launchPanel');
  const channelPanel = document.getElementById('channelPanel');
  const visitorName = document.getElementById('visitorName');
  const start = document.getElementById('start');
  const reset = document.getElementById('reset');
  const status = document.getElementById('status');
  const channels = [...document.querySelectorAll('[data-channel]')];
  const cameras = [...document.querySelectorAll('[data-camera]')];
  const REMOTE_LONG_POLL_SECONDS = 25;
  const REMOTE_RETRY_MS = 3000;
  let syncTimer = 0;
  let syncInFlight = false;
  let syncController = null;
  let lastStateUpdatedAt = 0;
  window.__resumeCompanionStatePolls = 0;

  async function send(path, payload = {}) {
    const response = await fetch(path, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session,...payload}),
      cache:'no-store',
    });
    if (!response.ok) throw new Error('Command failed');
    return response.json();
  }
  function showMode(mode, activeChannel = '', activeCamera = 'hero') {
    const channelMode = mode === 'channels';
    launchPanel.hidden = channelMode;
    channelPanel.hidden = !channelMode;
    channels.forEach((item) => item.classList.toggle('is-active', item.dataset.channel === activeChannel));
    cameras.forEach((item) => item.classList.toggle('is-active', item.dataset.camera === activeCamera));
  }
  launchPanel.addEventListener('submit', async (event) => {
    event.preventDefault();
    start.disabled = true;
    status.textContent = 'Sending…';
    try {
      await send('/api/companion/start', {visitorName:visitorName.value.trim().slice(0,24)});
      navigator.vibrate?.(35);
      status.textContent = 'Running · waiting for intermission';
    } catch (_) {
      status.textContent = 'Could not reach the main screen · try again';
    } finally {
      start.disabled = false;
    }
  });
  channels.forEach((item) => item.addEventListener('click', async () => {
    try {
      await send('/api/companion/channel', {channel:item.dataset.channel});
      navigator.vibrate?.(25);
    } catch (_) {
      status.textContent = 'Channel failed · try again';
    }
  }));
  cameras.forEach((item) => item.addEventListener('click', async () => {
    try {
      await send('/api/companion/camera', {camera:item.dataset.camera});
      navigator.vibrate?.(18);
    } catch (_) {
      status.textContent = 'Camera failed · try again';
    }
  }));
  reset.addEventListener('click', async () => {
    try {
      await send('/api/companion/stop');
      showMode('intro');
      status.textContent = 'Stopped · ready to run again';
    } catch (_) {
      status.textContent = 'Reset failed · try again';
    }
  });
  async function syncState() {
    if (syncInFlight || document.hidden) return;
    if (!session) {
      status.textContent = 'Missing session · rescan the QR code';
      return;
    }
    syncInFlight = true;
    let delayMs = 0;
    try {
      window.__resumeCompanionStatePolls += 1;
      document.documentElement.dataset.companionStatePolls = String(window.__resumeCompanionStatePolls);
      syncController?.abort();
      const controller = new AbortController();
      syncController = controller;
      const response = await fetch('/api/companion/state?session=' + encodeURIComponent(session)
        + '&since=' + encodeURIComponent(lastStateUpdatedAt)
        + '&wait=' + REMOTE_LONG_POLL_SECONDS, {cache:'no-store',signal:controller.signal});
      if (syncController === controller) syncController = null;
      if (!response.ok) throw new Error('State failed');
      const payload = await response.json();
      lastStateUpdatedAt = Math.max(lastStateUpdatedAt, Number(payload.updatedAt) || 0);
      showMode(payload.displayMode || 'intro', payload.activeChannel || '', payload.activeCamera || 'hero');
      status.textContent = payload.displayMode === 'channels'
        ? 'Intermission · select the Macintosh monitor'
        : payload.command === 'start'
          ? 'Running · waiting for intermission'
          : 'Connected · waiting for you';
    } catch (error) {
      if (error?.name === 'AbortError') return;
      status.textContent = 'Connection interrupted · retrying';
      delayMs = REMOTE_RETRY_MS;
    } finally {
      syncInFlight = false;
      window.clearTimeout(syncTimer);
      if (!document.hidden) syncTimer = window.setTimeout(syncState, delayMs);
    }
  }
  syncState();
  document.addEventListener('visibilitychange', () => {
    syncController?.abort();
    syncController = null;
    window.clearTimeout(syncTimer);
    syncTimer = 0;
    if (!document.hidden) syncState();
  });
</script>
</body>
</html>
